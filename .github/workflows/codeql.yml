# CodeQL static analysis for agent-skills-toolkit.
#
# Advanced setup: this committed workflow file is the configuration source of truth
# (not the repository Settings toggle). Targets the javascript-typescript query suite.
# Results post to the Security tab. SHA-pinned per supply-chain hygiene (change 8 of
# the CI evolution plan in docs/internal/execution/05-ci-plan.md).

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9 pinned 2026-09-04
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9 pinned 2026-09-04

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9 pinned 2026-09-04
        with:
          category: "/language:javascript-typescript"
