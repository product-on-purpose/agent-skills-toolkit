# Release automation for agent-skills-toolkit.
#
# Trigger: a pushed tag "v*". The job re-runs the conformance gate as a safety net,
# enforces a version-consistency guard (the tag must equal every version-bearing
# manifest), extracts this version's section from RELEASE-NOTES.md, and publishes a
# GitHub release. The toolkit is installed from the product-on-purpose marketplace by
# cloning the pinned commit, so no archive artifact is built here.
#
# Per Standard sec 4.1/4.4, this workflow holds no validation logic of its own beyond
# the guard: the gate is the same portable `node scripts/check.mjs` a contributor runs
# locally. The PR-time validate + build-site jobs live in ci.yml and are unchanged.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc (the committed pin is the single CI source of truth)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Runs the conformance gate, the README drift guard, the release-count guard and vendor-watch, and
      # reports all four before deciding. It replaces four RELEASE.md checklist lines a human ticked, one
      # of which - "vendor-watch green, and its run under 30 days old" - had never been run by any
      # workflow, so a tag could publish a claim the vendor's page had stopped making (review wave 2, H2).
      #
      # vendor-watch exit 1 (a claim is GONE or STALE) blocks the tag and cannot be overridden here. Exit 2
      # (a page could not be FETCHED) is a third party's outage; re-run this workflow when it clears, or if
      # the release genuinely cannot wait, run the aggregate locally with
      # `--allow-vendor-unreachable "<reason>"` and record that reason in the release notes.
      # GITHUB_TOKEN is exported deliberately. `action-pin-watch`, the fifth gate, resolves every
      # `uses:` pin against the GitHub API; unauthenticated that is 60 requests an hour per IP, and a
      # shared runner's egress IP is shared with every other tenant on it. The check treats a rate limit
      # as a REFUSAL (exit 2) rather than a pass, which is correct - and would block the very tag this
      # job exists to certify. Authenticated the limit is 1000/hour. Measured 2026-08-19 by a
      # throwaway-branch drill: the unauthenticated job PASSED on that runner, so this is a latent risk
      # rather than a reproduced failure, and the mitigation is free.
      - name: Release-ready gates (conformance, README drift, release counts, vendor-watch, action-pins)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-ready.mjs

      - name: Guard - tag must equal every version-bearing manifest
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          fail=0
          check() {
            file="$1"
            actual="$(node -p "JSON.parse(require('fs').readFileSync('$file','utf8')).version")"
            if [ "$actual" != "$TAG" ]; then
              echo "::error file=$file::version $actual does not match tag $TAG"
              fail=1
            else
              echo "ok: $file = $actual"
            fi
          }
          check package.json
          check library.json
          check .claude-plugin/plugin.json
          check .codex-plugin/plugin.json
          if [ "$fail" -ne 0 ]; then
            echo "::error::tag/version mismatch; aborting before publishing a release"
            exit 1
          fi

      # E57. The extraction MOVED out of this file into scripts/check-release-notes-section.mjs; it was
      # not copied. Standard sec 4.1/4.4 forbids CI configuration from holding validation logic of its own,
      # and an inline awk program deciding whether a release may publish was exactly that. Being in YAML it
      # was also unreachable from `release-ready`, the gate that runs BEFORE the tag - so this correct
      # refusal fired only after the tag was pushed and the npm publish approved. v1.17.1 shipped its notes
      # heading as a literal `## %s - %s` that way. The same script is now release-ready's sixth gate, and
      # this step STAYS as the second line of defence rather than being replaced by it.
      - name: Extract this version's RELEASE-NOTES section
        run: node scripts/check-release-notes-section.mjs --extract "${GITHUB_REF_NAME#v}" --out RELEASE_BODY.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3 pinned 2026-09-04
        with:
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
