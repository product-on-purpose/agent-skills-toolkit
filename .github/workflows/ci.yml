# CI for agent-skills-toolkit.
#
# Per Standard sec 4.1 and 4.4, this workflow contains NO validation logic of its
# own: it only shells out to the portable Node scripts under scripts/. That keeps
# local and CI runs identical (a contributor can reproduce any CI failure with the
# same command locally) and keeps the plugin independent of any CI provider.
#
# Phase 1: the validation spine is now live. This workflow runs the full unit test
# suite and then the conformance gate (`node scripts/check.mjs`). Both steps are
# pure script invocations - the YAML itself holds no validation logic.
#
# validator-parity (ADR 0042): the same rule applies there too - this job installs the two vendor
# CLIs and then runs ONE portable script, scripts/check-parity.mjs, which is where every parsing and
# comparison decision actually lives. Report-only for v1.11.0 (see the script's PARITY_MODE), so this
# job never fails the build on a disagreement; it always runs `node scripts/check-parity.mjs .` to
# completion and its exit code is whatever that script decides.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22.12.0, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Coverage report (report-only, no gate)
        run: npx c8 --reporter=text-summary node --test || true

      - name: Conformance gate (self-validation)
        run: node scripts/check.mjs

      # LAST on purpose (#310). This step used to run FIRST, and on 2026-09-03 an npm incident made it
      # fail three times - which skipped the unit tests, the coverage report and the conformance gate
      # outright, while `validate` is a required check on `main`. A run that graded this repository is
      # worth having even when the audit could not be performed, so the audit now runs after everything
      # it used to be able to skip.
      #
      # The exit-code split lives in the script, not here (Standard sec 4.1/4.4): 1 is a real advisory
      # and reds the job, 2 is "the registry could not be read" and is reported as a warning, the same
      # posture vendor-watch and action-pin-watch exit 2 already carry (ADR 0053 - a pin's label is a
      # claim this repository makes). This step maps 2 to an annotation and nothing else.
      - name: Audit dependencies (blocking at high severity)
        run: |
          # `set +e` around the call on purpose: GitHub runs this with `bash -e`, so an unguarded
          # non-zero exit would end the step before the code could be read - and reading the code is
          # the entire point.
          set +e
          node scripts/audit-deps.mjs --level high
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning title=Dependency audit could not be performed::npm could not be read; the suite and the conformance gate above still ran. Re-run this job once the registry recovers."
            exit 0
          fi
          exit "$code"

  # Windows platform guard: proves the suite and the gate pass on native win32 path handling (backslash
  # separators, CommandLineToArgvW argv parsing), which ubuntu-latest cannot exercise. A single Node
  # version, not the full matrix - this job is a platform guard, not a second full cost multiplier.
  # NOTE: this is a NEW required-check candidate. Branch protection's required status checks do not pick
  # up a new job automatically; the maintainer must add "validate-windows" to the required list by hand,
  # or a green PR will keep implying Windows coverage it does not actually have.
  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Conformance gate (self-validation)
        run: node scripts/check.mjs

  # Non-deploying site build: proves the Astro Starlight site in site/ compiles on
  # every push and PR, so a green PR predicts a green deploy. Catalog drift is covered
  # by the validate job (npm test). Deployment itself lives in deploy-pages.yml; this
  # job never uploads a Pages artifact.
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc (pin 24; the committed pin is the single CI source of truth)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The generated Pattern S docs tree (emitted by scripts/gen-docs-site.mjs when astro.config.mjs
      # loads, not a prebuild hook) must stay gitignored - a committed generated page is a drift surface
      # (ADR 0024 D2, R-SITE-2). This runs before the build so a tracked generated page fails fast.
      - name: Assert generated docs tree is untracked (R-SITE-2)
        run: node scripts/check-generated-untracked.mjs

      - name: Build site (no deploy)
        id: build
        run: npm run build

      # Clause 14.11 link/route integrity, enforced in the PR build (the donor pattern from
      # pm-skills; see site/scripts/ and ADR 0026). Both gate on the build step's own outcome, so
      # they run only when the build succeeded (a build failure surfaces the real Astro error, not a
      # secondary "dist not found") yet still run independently of each other (a failure in one
      # still reports the other, since the condition overrides the default success() of all prior
      # steps). Both operate on the built dist in the site working directory.
      - name: Check rendered links + anchors (clause 14.11a; enforcing)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          STRICT_ANCHORS: "1"
        run: node scripts/check-rendered-links.mjs dist

      - name: Check route parity (clause 14.11b; no published route removed without a redirect)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-route-parity.mjs dist scripts/route-manifest.txt

      # RS-D3's generators run ONLY in deploy-pages.yml, which fires on push to main - so without this
      # step no pull request ever exercises them and a break would be found by the deploy that publishes
      # it. That is the shape of both escaped Action defects (self-CI never ran the path that mattered),
      # so the generator runs here too, into this job's throwaway dist/. Nothing is uploaded; the job
      # proves the generator RUNS, and its own unit tests prove what it writes.
      - name: Publish the full verdict (RS-D3; proves the generator runs on a PR, uploads nothing)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npm ci --prefix ..
          node ../scripts/gen-site-reports.mjs .. --out-dir dist/reports

  # Validator-parity harness (ADR 0042 - validator parity is report-only and checks parsed values):
  # runs the first-party validators (claude plugin validate, the skills-ref reference validator) and
  # reports where they disagree with what this repository claims, plus a parsed-values round-trip of
  # every skill's metadata.* through the reference PARSER (the ADR 0040 metadata.chain incident is why
  # that half exists - a harness that only checked exit codes reported this repo clean while a value
  # was being silently mangled). GATING since v1.12.0: this job runs to completion and its exit code is
  # whatever scripts/check-parity.mjs's PARITY_MODE decides, which is now "gating" - an undocumented
  # disagreement, a metadata-parity mismatch, or the reference parser failing to install all fail this
  # job. ADR 0042 named the evidence that released the flip; the v1.12.0 packet records it. A separate
  # job, not a step folded into `validate`, because it installs two extra vendor CLIs the plain
  # validate jobs deliberately do not carry.
  validator-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The claude CLI, from the npm package @anthropic-ai/claude-code. `claude plugin validate` was
      # verified (2026-08-11) to run fully offline and unauthenticated: with an isolated HOME/config
      # dir, no ANTHROPIC_API_KEY or OAuth token, and outbound traffic forced to fail via a bogus
      # HTTP(S)_PROXY, the command still validated correctly. No secret is required here - only this
      # install step's own outbound access to the npm registry, the same access `npm ci` above needs.
      - name: Install the claude CLI
        run: npm install -g @anthropic-ai/claude-code

      # skills-ref (PyPI), run through uv/uvx exactly as the local reproduction commands in
      # docs/internal/release-plans/plan_v1.10.1/validator-parity-baseline.md do, so a CI failure here
      # reproduces with the identical command a contributor would type locally. Also verified offline
      # and unauthenticated the same way as the claude CLI above.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv (provides uvx)
        run: pip install uv

      - name: Validator parity (gating since v1.12.0 - see ADR 0042 and PARITY_MODE in scripts/check-parity.mjs)
        run: node scripts/check-parity.mjs .

  # ---------------------------------------------------------------------------------------------
  # RS-D1: grade this repository THROUGH the Action it publishes, not just by calling the scripts.
  #
  # The `validate` jobs above run `node scripts/check.mjs` directly. That is the fast path and the
  # clean-room baseline, and it stays. What it cannot see is the Action's own wiring, and the Action
  # shipped broken to every consumer twice while those jobs stayed green: v1.16.1's G2 defect, and
  # v1.16.2 (dd1b3bf), where `cache-dependency-path: ${{ github.action_path }}/package-lock.json`
  # made setup-node fail and skipped the gate entirely - consumers saw a red check that had never
  # applied a single rule. STATUS.md recorded that as "its own CI never caught it". These two jobs
  # are what retires that sentence.
  #
  # THERE ARE TWO. RS-D1 as ratified named `uses: ./` and offered `uses: <repo>@main` only as a fallback
  # if the local form did not work. The local form works. Both ship anyway, and the reason is a MEASURED
  # one - an earlier version of this comment argued the point instead and was wrong.
  #
  # WHAT WAS ARGUED, AND FALSIFIED: that `uses: ./` structurally could not reproduce the v1.16.2 class,
  # since `github.action_path` IS the workspace for a local action while the defect depended on it being
  # outside. PR #298 reintroduced those exact two lines on a scratch branch. BOTH jobs went red (the
  # direct-script jobs stayed green), so the claim was simply false.
  #
  # WHAT THE RUN MEASURED - one mutation, two different mechanisms:
  #
  #   gate-via-action            action_path = /home/runner/work/agent-skills-toolkit/agent-skills-toolkit/.
  #                              -> pattern `.../agent-skills-toolkit/.//package-lock.json`
  #                              -> "Invalid pattern ... Relative pathing '.' and '..' is not allowed"
  #
  #   gate-via-published-action  action_path = /home/runner/work/_actions/product-on-purpose/
  #                                            agent-skills-toolkit/<ref>
  #                              -> "Some specified paths were not resolved, unable to cache dependencies"
  #                                 which is the v1.16.2 error VERBATIM, in the geometry consumers hit
  #
  # `uses: ./` leaves a trailing `/.` in action_path, so the pattern is syntactically invalid and gets
  # rejected before resolution is attempted. The local job reds by accident of this defect's shape meeting
  # this `uses:` form - not by reproducing its cause.
  #
  # So the second job is kept on that measurement and nothing more: those two action_path values are
  # different environments, and the published-ref job is the only thing in this repository's CI that
  # exercises remote `uses: owner/repo@ref` resolution and the `_actions/` tree at all. No claim is made
  # here about which hypothetical future defects each job would catch. That is the shape of claim the run
  # just falsified, and it is not worth making twice.
  #
  # Sec 4.1/4.4 holds in both: each job invokes the Action, which invokes the portable scripts. No
  # grading decision is made in this YAML.
  # grading decision is made in this YAML.
  #
  # NOTE: both are NEW required-check candidates, the same caveat `validate-windows` carries above -
  # branch protection does not adopt a new job by itself.
  gate-via-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `uses: ./` - the working tree's action.yml, so this PR's Action is the one under test.
      - name: Grade through the working-tree Action
        id: gate
        uses: ./
        with:
          path: .
          fail-on-error: true
          annotations: true
          sarif: true

      # A distinct `category` is required: codeql.yml already uploads SARIF for these same commits,
      # and two uploads sharing a category overwrite each other's results in the Security tab.
      - name: Upload SARIF to the Security tab
        if: ${{ !cancelled() && steps.gate.outputs.sarif-path != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9 pinned 2026-09-04
        with:
          sarif_file: ${{ steps.gate.outputs.sarif-path }}
          category: askit-gate-working-tree

      - name: Echo what the Action returned
        if: ${{ !cancelled() }}
        run: |
          echo "tier=${{ steps.gate.outputs.tier }} errors=${{ steps.gate.outputs.errors }} warnings=${{ steps.gate.outputs.warnings }}"

  # The consumer-position mirror. See the block above for why this exists alongside `gate-via-action`
  # rather than instead of it.
  #
  # `fail-on-error: false` DELIBERATELY. This job is an Action-HEALTH probe, not a second grader:
  # `gate-via-action` above already grades the working tree and fails on a real finding. Here the
  # Action's own scripts are main's, not this PR's, so a grading disagreement between the two jobs is
  # ordinary (a PR that adds a check runs it in one job and not the other) and is not this job's
  # signal. Its signal is whether the published Action can RUN AT ALL from the consumer's position -
  # and a v1.16.2-class break fails the composite step itself, which reds this job regardless of
  # fail-on-error. That is exactly the separation the flag exists for.
  gate-via-published-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Grade through the Action as published on main
        id: gate
        uses: product-on-purpose/agent-skills-toolkit@main
        with:
          path: .
          fail-on-error: false
          annotations: false
          sarif: false

      - name: Echo what the published Action returned
        if: ${{ !cancelled() }}
        run: |
          echo "tier=${{ steps.gate.outputs.tier }} errors=${{ steps.gate.outputs.errors }} warnings=${{ steps.gate.outputs.warnings }}"
